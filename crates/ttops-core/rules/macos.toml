[[rules]]
id = "browser-caches"
name = "Browser caches"
category = "A"
kind = "dirContents"
paths = ["{cache}/Google/Chrome", "{cache}/com.apple.Safari", "{cache}/Mozilla/Firefox"]
regenerable = true
preselect = true

[[rules]]
id = "npm-cache"
name = "npm cache"
category = "A"
kind = "dirContents"
paths = ["~/.npm"]
regenerable = true
preselect = true

[[rules]]
id = "pip-cache"
name = "pip cache"
category = "A"
kind = "dirContents"
paths = ["{cache}/pip"]
regenerable = true
preselect = true

[[rules]]
id = "uv-cache"
name = "uv cache"
category = "A"
kind = "dirContents"
paths = ["{cache}/uv"]
regenerable = true
preselect = true

[[rules]]
id = "homebrew-cache"
name = "Homebrew cache"
category = "A"
kind = "dirContents"
paths = ["{cache}/Homebrew"]
regenerable = true
preselect = true

[[rules]]
id = "poetry-cache"
name = "Poetry cache"
category = "A"
kind = "dirContents"
paths = ["{cache}/pypoetry"]
regenerable = true
preselect = true

[[rules]]
id = "gradle-cache"
name = "Gradle cache"
category = "A"
kind = "dirContents"
paths = ["~/.gradle/caches"]
regenerable = true
preselect = true

[[rules]]
id = "maven-cache"
name = "Maven cache"
category = "A"
kind = "dirContents"
paths = ["~/.m2/repository"]
regenerable = true
preselect = true

[[rules]]
id = "cargo-registry"
name = "Cargo registry"
category = "A"
kind = "dirContents"
paths = ["~/.cargo/registry"]
regenerable = true
preselect = true

[[rules]]
id = "app-updater-caches"
name = "App updater caches"
category = "A"
kind = "dirContents"
paths = ["{cache}/com.github.Electron", "{cache}/SquirrelTemp"]
regenerable = true
preselect = true

[[rules]]
id = "container-build-cache"
name = "Container build cache"
category = "A"
kind = "containerBuildCache"
regenerable = true
preselect = true

[[rules]]
id = "container-unused-images"
name = "Unused registry container images"
category = "A"
kind = "containerImages"
regenerable = true
preselect = true

[[rules]]
id = "trash"
name = "Trash"
category = "A"
kind = "trash"
paths = ["~/.Trash"]
regenerable = true
preselect = false
permanentOnly = true

# Category B — developer build outputs under user-chosen project roots.
[[rules]]
id = "project-build-outputs"
name = "Project build outputs"
category = "B"
kind = "projectOutputs"
regenerable = true
outputs = [
  { name = "node_modules", markers = ["package.json"] },
  { name = ".next", markers = ["package.json"] },
  { name = ".nuxt", markers = ["package.json"] },
  { name = "target", markers = ["Cargo.toml", "pom.xml"] },
  { name = "build", markers = ["build.gradle", "build.gradle.kts"] },
  { name = ".gradle", markers = ["build.gradle", "build.gradle.kts", "settings.gradle", "settings.gradle.kts"] },
  { name = ".venv" },
  { name = "venv", markers = ["requirements.txt", "pyproject.toml", "setup.py"] },
  { name = ".tox", markers = ["tox.ini", "pyproject.toml", "setup.py"] },
  { name = ".terraform", markers = ["main.tf", "versions.tf"] },
]

# Category C — large personal data, never preselected.
[[rules]]
id = "local-model-stores"
name = "Local AI models"
category = "C"
kind = "dir"
paths = ["~/.ollama/models", "~/.cache/huggingface", "~/.lmstudio/models"]

[[rules]]
id = "chat-app-media"
name = "Chat app media"
category = "C"
kind = "dir"
paths = [
  "~/Library/Group Containers/group.net.whatsapp.WhatsApp.shared/Message/Media",
  "~/Library/Group Containers/6N38VWS5BX.ru.keepcoder.Telegram",
]
reviewOnly = true
guidance = "Clean inside the app: open its storage settings and remove media there."

[[rules]]
id = "large-files"
name = "Large files"
category = "C"
kind = "largeFiles"
paths = ["~"]
