[[rules]]
id = "browser-caches"
name = "Browser caches"
category = "A"
kind = "dirContents"
paths = ["{cache}/Google/Chrome", "{cache}/com.apple.Safari", "{cache}/Mozilla/Firefox"]
regenerable = true
preselect = true

